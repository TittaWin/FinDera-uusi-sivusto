# Netlify-asetukset. Tiedosto luetaan automaattisesti julkaisun yhteydessä.

[build]
  publish = "."
  # Vie content/-kansion tekstit sivuille ja luo sen jälkeen englanninkieliset
  # sivut kansioon en/, jotta julkaistu sivusto vastaa aina content/-kansiota
  # molemmilla kielillä. Jos kumpi tahansa skripti epäonnistuu, julkaisu
  # keskeytyy ja edellinen versio jää pystyyn.
  command = "python3 tools/apply_content.py && python3 tools/build_lang.py"

# Fontit eivät koskaan muutu, joten ne saavat pitkän välimuistin.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Kuvat, tyylit ja skriptit tarkistetaan palvelimelta jokaisella käynnillä.
# Selain käyttää välimuistia vain, jos tiedosto ei ole muuttunut.
#
# HUOM: kuvatiedostojen nimet pysyvät samoina päivitysten välillä
# (esim. galleria-1-800.webp), joten pitkä välimuisti jättäisi vanhat
# kuvat näkyviin päivityksen jälkeen. Siksi tässä käytetään no-cache.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/assets/logos/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, no-cache"

# HTML-sivut haetaan aina tuoreena
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/palvelut"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/projektit"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/minusta"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/yhteystiedot"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/tietosuoja"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/landing1"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/kiitos"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/en/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, no-cache"

# Perusturvallisuusotsakkeet
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Sisältökansion tekstitiedostot julkaistaan sivuston mukana, mutta ne eivät
# kuulu hakutuloksiin — muuten sama teksti näkyisi Googlessa kahteen kertaan.
[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Työkalut ja ohjeet eivät myöskään kuulu hakutuloksiin
[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/README.md"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Netlifyn oma osoite findera-esikatselu.netlify.app tarjoili aiemmin saman
# sivuston kuin www.findera.fi (sama sisältö, sama etag) ilman hakukoneestoa.
# Hakukoneelle se on koko sivuston kaksoiskappale, joten se ohjataan pysyvästi
# oikeaan osoitteeseen. Sääntö on ensimmäisenä, koska säännöt luetaan ylhäältä
# alas ja tämä koskee koko osoitetta.
#
# Netlifyn omat deploy previewit (deploy-preview-N--...netlify.app) eivät osu
# tähän sääntöön, ja Netlify merkitsee ne itse noindex-otsakkeella.
[[redirects]]
  from = "https://findera-esikatselu.netlify.app/*"
  to = "https://www.findera.fi/:splat"
  status = 301
  force = true

# Sivuston osoitteet ovat päätteettömiä (/palvelut, ei /palvelut.html).
# Netlify tarjoilee tiedoston palvelut.html osoitteessa /palvelut ilman
# erillistä sääntöä, joten tässä ohjataan vain vanhat .html-osoitteet uusiin,
# jotta hakukoneet ja vanhat linkit päätyvät kanoniseen osoitteeseen.
#
# force = true on välttämätön: ilman sitä olemassa oleva tiedosto voittaa
# ohjaussäännön eikä ohjaus laukea lainkaan.
#
# HUOM: 404.html ei ole listalla — Netlify käyttää sitä virhesivuna
# sellaisenaan, eikä sille saa tehdä ohjausta.

[[redirects]]
  from = "/palvelut.html"
  to = "/palvelut"
  status = 301
  force = true

[[redirects]]
  from = "/projektit.html"
  to = "/projektit"
  status = 301
  force = true

[[redirects]]
  from = "/minusta.html"
  to = "/minusta"
  status = 301
  force = true

[[redirects]]
  from = "/yhteystiedot.html"
  to = "/yhteystiedot"
  status = 301
  force = true

[[redirects]]
  from = "/tietosuoja.html"
  to = "/tietosuoja"
  status = 301
  force = true

[[redirects]]
  from = "/landing1.html"
  to = "/landing1"
  status = 301
  force = true

[[redirects]]
  from = "/kiitos.html"
  to = "/kiitos"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Sama päätteetön muoto englanninkielisillä sivuilla.

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/en/services.html"
  to = "/en/services"
  status = 301
  force = true

[[redirects]]
  from = "/en/projects.html"
  to = "/en/projects"
  status = 301
  force = true

[[redirects]]
  from = "/en/about.html"
  to = "/en/about"
  status = 301
